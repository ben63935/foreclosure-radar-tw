name: Daily Foreclosure Sync & Email Digest

on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      target_districts:
        description: '動態指定搜尋行政區 (選填，空白則自動讀取 subscriptions.json)'
        required: false
        default: ''
      max_price_wan:
        description: '動態指定預算上限萬元 (選填，空白則自動讀取 subscriptions.json)'
        required: false
        default: '0'

permissions:
  contents: write
  models: read

jobs:
  sync-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Taipei
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Dynamic Search Foreclosure Scraper & Free GitHub AI Pre-Audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scraper_pipeline.py \
            --output cases.json \
            --health source_health.json \
            --subscriptions subscriptions.json \
            --districts "${{ github.event.inputs.target_districts }}" \
            --max-price "${{ github.event.inputs.max_price_wan || '0' }}"

      - name: Run Subscription Filter & Send Daily Email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python email_notifier.py --cases cases.json --subscriptions subscriptions.json

      - name: Commit & Push Updated Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "ForeclosureRadar-Bot"
          git add cases.json source_health.json latest_digest_preview.html || true
          git diff --staged --quiet || (git commit -m "chore(data): dynamic foreclosure search sync $(date +'%Y-%m-%d %H:%M')" && git push)
