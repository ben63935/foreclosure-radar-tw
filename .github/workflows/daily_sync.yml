name: Daily Foreclosure Sync & Email Digest

on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Taipei
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Multi-Platform Foreclosure Scraper
        run: python scraper_pipeline.py --output cases.json --health source_health.json

      - name: Run Subscription Filter & Send Daily Email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python email_notifier.py --cases cases.json

      - name: Commit & Push Updated Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "ForeclosureRadar-Bot"
          git add cases.json source_health.json || true
          git diff --staged --quiet || (git commit -m "chore(data): daily foreclosure sync $(date +'%Y-%m-%d %H:%M')" && git push)
